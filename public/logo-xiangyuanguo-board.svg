<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" role="img" aria-labelledby="boardTitle boardDesc">
  <title id="boardTitle">香橼果养老院 Logo 设计展示板</title>
  <desc id="boardDesc">展示香橼果养老院主标、图标、深色反白版本和品牌识别说明。</desc>
  <defs>
    <linearGradient id="boardBg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset="1" stop-color="#e6f1f3"/>
    </linearGradient>
    <linearGradient id="boardCitron" x1="84" y1="84" x2="232" y2="232" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f4cf62"/>
      <stop offset="0.62" stop-color="#e7ad30"/>
      <stop offset="1" stop-color="#c98918"/>
    </linearGradient>
    <linearGradient id="boardLeaf" x1="124" y1="40" x2="248" y2="114" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6d8f4c"/>
      <stop offset="1" stop-color="#2f593d"/>
    </linearGradient>
    <symbol id="xiangyuanMark" viewBox="0 0 256 256">
      <rect x="10" y="10" width="236" height="236" rx="48" fill="#fffaf0"/>
      <path d="M128 18c-61 0-108 45-108 106 0 76 108 124 108 124s108-48 108-124c0-61-47-106-108-106Z" fill="#2f593d"/>
      <circle cx="128" cy="116" r="78" fill="#fffaf0"/>
      <circle cx="128" cy="118" r="65" fill="url(#boardCitron)"/>
      <path d="M125 48c25-42 62-57 110-44-10 49-45 70-110 44Z" fill="url(#boardLeaf)"/>
      <path d="M146 47c19-13 42-23 69-29" fill="none" stroke="#e8f2d7" stroke-width="8" stroke-linecap="round"/>
      <path d="M76 126 128 86l52 40" fill="none" stroke="#273126" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M92 124v49h72v-49" fill="none" stroke="#273126" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M102 170c17 16 34 23 52 23s35-7 52-23" fill="none" stroke="#fff7d8" stroke-width="13" stroke-linecap="round"/>
      <circle cx="128" cy="215" r="23" fill="#315d75"/>
      <text x="128" y="225" text-anchor="middle" fill="#fffaf0" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="28" font-weight="850">宛</text>
    </symbol>
  </defs>

  <rect width="1200" height="860" fill="url(#boardBg)"/>
  <rect x="64" y="56" width="1072" height="748" rx="28" fill="#fffdf6" stroke="#d8d4c6" stroke-width="2"/>

  <text x="102" y="118" fill="#273126" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="32" font-weight="850">香橼果养老院 Logo 方向</text>
  <text x="102" y="154" fill="#596457" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="18" font-weight="650">关键词：香橼果记忆点 · 家屋照护 · 河南南阳区位 · 温暖可信</text>

  <g transform="translate(92 204)">
    <use href="#xiangyuanMark" width="156" height="156"/>
    <g font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif">
      <text x="192" y="62" fill="#273126" font-size="48" font-weight="850" letter-spacing="1">香橼果养老院</text>
      <rect x="194" y="84" width="158" height="36" rx="18" fill="#e6f1f3" stroke="#315d75" stroke-opacity="0.26"/>
      <path d="M216 92c-7 0-12 5-12 12 0 8 12 17 12 17s12-9 12-17c0-7-5-12-12-12Z" fill="#315d75"/>
      <circle cx="216" cy="104" r="4" fill="#fffaf0"/>
      <text x="238" y="109" fill="#315d75" font-size="22" font-weight="800">河南 · 南阳</text>
      <text x="374" y="112" fill="#2f593d" font-size="23" font-weight="750">宛美养老 · 医养康养生活共同体</text>
      <text x="194" y="152" fill="#596457" font-size="15" font-weight="700" letter-spacing="3">XIANGYUANGUO CARE HOME</text>
    </g>
  </g>

  <rect x="92" y="440" width="302" height="250" rx="18" fill="#fffaf0" stroke="#d8d4c6"/>
  <use href="#xiangyuanMark" x="154" y="478" width="176" height="176"/>
  <text x="244" y="724" text-anchor="middle" fill="#273126" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="20" font-weight="800">方形图标 / 头像 / favicon</text>

  <rect x="450" y="440" width="302" height="250" rx="18" fill="#263428"/>
  <use href="#xiangyuanMark" x="512" y="478" width="176" height="176"/>
  <text x="602" y="724" text-anchor="middle" fill="#273126" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="20" font-weight="800">深底环境保持识别度</text>

  <g transform="translate(808 452)" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif">
    <text x="0" y="0" fill="#273126" font-size="24" font-weight="850">设计说明</text>
    <text x="0" y="44" fill="#596457" font-size="18">1. 香橼果让品牌名有直接图形记忆点。</text>
    <text x="0" y="82" fill="#596457" font-size="18">2. 果内家屋表达养老院、照护与安心托付。</text>
    <text x="0" y="120" fill="#596457" font-size="18">3. 底部蓝色“宛”点明南阳地域别称。</text>
    <text x="0" y="158" fill="#596457" font-size="18">4. 文字锁定“河南 · 南阳”，避免位置模糊。</text>
    <text x="0" y="218" fill="#2f593d" font-size="18" font-weight="800">主色：香橼黄 #e7ad30 / 叶绿 #2f593d / 南阳蓝 #315d75</text>
  </g>
</svg>
