<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 180" role="img" aria-labelledby="logoTitle logoDesc">
  <title id="logoTitle">香橼果养老院品牌标志</title>
  <desc id="logoDesc">以香橼果、叶片、家屋、照护托举和南阳区位为核心意象的横版品牌标志，标注河南南阳。</desc>
  <defs>
    <linearGradient id="citronFill" x1="42" y1="40" x2="146" y2="144" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f4cf62"/>
      <stop offset="0.62" stop-color="#e7ad30"/>
      <stop offset="1" stop-color="#c98918"/>
    </linearGradient>
    <linearGradient id="leafFill" x1="82" y1="24" x2="154" y2="78" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6d8f4c"/>
      <stop offset="1" stop-color="#2f593d"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#273126" flood-opacity="0.14"/>
    </filter>
  </defs>

  <g filter="url(#softShadow)">
    <path d="M94 14c-43 0-75 31-75 74 0 53 75 86 75 86s75-33 75-86c0-43-32-74-75-74Z" fill="#2f593d"/>
    <circle cx="94" cy="84" r="54" fill="#fffaf0"/>
    <circle cx="94" cy="86" r="45" fill="url(#citronFill)"/>
    <path d="M91 37c17-29 42-39 76-30-7 34-31 49-76 30Z" fill="url(#leafFill)"/>
    <path d="M105 36c13-9 29-16 48-20" fill="none" stroke="#e8f2d7" stroke-width="5" stroke-linecap="round"/>
    <path d="M59 91 94 64l35 27" fill="none" stroke="#273126" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M70 89v34h48V89" fill="none" stroke="#273126" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M78 119c11 10 22 15 34 15s23-5 34-15" fill="none" stroke="#fff7d8" stroke-width="8" stroke-linecap="round"/>
    <circle cx="94" cy="148" r="16" fill="#315d75"/>
    <text x="94" y="155" text-anchor="middle" fill="#fffaf0" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="18" font-weight="800">宛</text>
  </g>

  <g font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif">
    <text x="208" y="72" fill="#273126" font-size="46" font-weight="850" letter-spacing="1">香橼果养老院</text>
    <g transform="translate(210 92)">
      <rect x="0" y="0" width="158" height="36" rx="18" fill="#e6f1f3" stroke="#315d75" stroke-opacity="0.26"/>
      <path d="M22 8c-7 0-12 5-12 12 0 8 12 17 12 17s12-9 12-17c0-7-5-12-12-12Z" fill="#315d75"/>
      <circle cx="22" cy="20" r="4" fill="#fffaf0"/>
      <text x="44" y="25" fill="#315d75" font-size="22" font-weight="800">河南 · 南阳</text>
    </g>
    <text x="388" y="119" fill="#2f593d" font-size="24" font-weight="750">宛美养老 · 医养康养生活共同体</text>
    <path d="M210 149h388" stroke="#d8d4c6" stroke-width="2" stroke-linecap="round"/>
    <text x="210" y="166" fill="#596457" font-size="15" font-weight="700" letter-spacing="3">XIANGYUANGUO CARE HOME</text>
  </g>
</svg>
